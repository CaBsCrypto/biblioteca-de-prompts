name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: Lint + Build (npm run qa)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
          GEMINI_MODEL: gemini-3.5-flash

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  smoke:
    name: Smoke test against PR preview
    runs-on: ubuntu-latest
    needs: qa
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Vercel preview
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          max-time: 240
        continue-on-error: true

      - name: Smoke test
        if: steps.vercel.outcome == 'success'
        run: npm run smoke:vercel -- ${{ steps.vercel.outputs.url }}
        env:
          GEMINI_API_KEY: ci-placeholder