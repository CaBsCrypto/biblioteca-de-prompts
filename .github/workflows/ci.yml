name: CI

on:
  push:
    branches: [main, "refactor/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: Lint + Build (npm run qa)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Catalog and route tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
          GEMINI_MODEL: gemini-3.5-flash

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  smoke:
    name: Smoke test against PR preview
    runs-on: ubuntu-latest
    needs: [qa, firestore-rules]
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Vercel preview
        id: vercel
        run: node scripts/wait-vercel-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_PROJECT: biblioteca-de-prompts

      - name: Smoke test
        run: npm run smoke:vercel -- "${{ steps.vercel.outputs.url }}"
        env:
          GEMINI_API_KEY: ci-placeholder

      - name: MCP protocol and widget smoke
        run: npm run smoke:mcp -- "${{ steps.vercel.outputs.url }}/api/mcp"

  firestore-rules:
    name: Firestore isolation and catalog approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Test Firestore rules in emulator
        run: npm run test:rules
